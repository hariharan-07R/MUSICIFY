
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | MUSICIFY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="/" class="logo">MUSICIFY<span>.</span></a>

        <h1>Create Account</h1>
        <p class="subtitle">Join the world of music.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-wrap">
                <input type="password" name="password" id="registerPassword"
                       placeholder="Minimum 8 characters" required minlength="8">
                <button type="button" class="show-btn"
                        onclick="togglePassword('registerPassword', this)">SHOW</button>
            </div>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Re-enter your password" required>

            <button type="submit" class="main-btn">CREATE ACCOUNT</button>
        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
